<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>营销活动管理平台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">M</span><span>营销活动管理平台</span></div>
      <div class="top-actions">
        <div class="requirement-picker">
          <button type="button" class="requirement-picker-button" id="requirementPickerButton" aria-expanded="false">
            <span>需求选择</span><strong id="requirementPickerValue">未选择</strong><span class="requirement-picker-arrow">⌄</span>
          </button>
          <div class="requirement-picker-menu" id="requirementPickerMenu" hidden></div>
        </div>
        <span class="environment">测试环境</span><span class="user-dot">运</span><span>运营管理员</span><span class="chevron">⌄</span>
      </div>
    </header>
    <div class="workspace">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="main" class="main"></main>
      <aside id="requirementChangePanel" class="requirement-change-panel" aria-live="polite"></aside>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <script type="module" src="app.js?v=202609181030"></script>
</body>
</html>
